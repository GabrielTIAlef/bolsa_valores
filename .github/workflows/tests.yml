name: Testes e notebook sintético

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bolsa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - name: Obter código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Instalar e verificar dependências
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip check
      - name: Executar testes
        run: python scripts/run_tests.py
      - name: Executar demonstração
        run: python scripts/run_demo.py
      - name: Executar notebook completo
        run: python scripts/validate_notebook.py
      - name: Registrar resumo
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              for name in ('tests-result.json', 'notebook-result.json'):
                  path = Path('.local-test') / name
                  if path.exists():
                      summary.write(f'### {name}\n\n```json\n{json.dumps(json.loads(path.read_text()), indent=2)}\n```\n\n')
                  else:
                      summary.write(f'{name}: resultado ausente; conferir os logs.\n\n')
          PY
